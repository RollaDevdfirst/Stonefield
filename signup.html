<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Create Account — Stonefield & Co.</title>
  <meta name="description" content="Create an account to save favorites and inquire faster." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://your-domain-here.pages.dev/signup.html" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Stonefield & Co." />
  <meta property="og:title" content="Create Account — Stonefield & Co." />
  <meta property="og:description" content="Create an account to save favorites, request a consultation, or track your inquiries." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200&auto=format&fit=crop" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Create Account — Stonefield & Co." />
  <meta name="twitter:description" content="Create an account to save favorites and inquire faster." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header site-header--solid">
    <div class="header-inner">
      <a href="index.html" class="logo">Stonefield&nbsp;&&nbsp;Co.</a>
      <nav class="main-nav">
        <a href="listings.html">Listings</a>
        <a href="about.html">About</a>
        <a href="dashboard.html">My Dashboard</a>
        <a href="login.html" class="nav-cta">Sign in</a>
      </nav>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="auth-section">
      <div class="auth-card">
        <p class="hero-kicker">Join Stonefield</p>
        <h1>Create an account</h1>
        <p class="auth-sub">Save favorites, and inquire without retyping your details each time.</p>

        <p class="auth-error" id="auth-error" hidden></p>

        <form id="signup-form" class="auth-form">
          <div class="auth-field">
            <label for="signup-name">Full name</label>
            <input type="text" id="signup-name" name="name" required autocomplete="name" />
          </div>
          <div class="auth-field">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" name="email" required autocomplete="email" />
          </div>
          <div class="auth-field">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" name="password" required autocomplete="new-password" minlength="8" />
          </div>
          <button type="submit" class="auth-submit">Create Account</button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <button class="google-btn" id="google-signup">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.08-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33C2.44 15.98 5.48 18 9 18z"/>
            <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.17.27-1.7V4.97H.96A9 9 0 000 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
          </svg>
          Continue with Google
        </button>

        <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer site-footer--dark">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="logo">Stonefield&nbsp;&&nbsp;Co.</span>
        <p>A portfolio demo project. Not a real estate agency.</p>
      </div>
      <div class="footer-links">
        <a href="listings.html">Listings</a>
        <a href="about.html">About</a>
        <a href="login.html">Sign in</a>
      </div>
    </div>
  </footer>

  <script src="js/nav.js"></script>
  <script type="module" src="js/auth-state.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
